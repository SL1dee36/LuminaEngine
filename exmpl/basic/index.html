<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaEngine - Базовый пример</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: monospace;
            color: #eee;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 4px;
            border: 1px solid #444;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <div><strong>LuminaEngine v1.4.1</strong></div>
        <div>Управление: W, A, S, D — перемещение игрока</div>
        <div>Пробел — прыжок</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
